description = "KaamKitPro Finance API for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "openpyxl>=3.1,<4.0",
    "reportlab>=4.2,<5.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
