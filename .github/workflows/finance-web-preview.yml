name: Finance Web Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build static frontend
        env:
          NEXT_PUBLIC_FINANCE_API_URL: ${{ vars.NEXT_PUBLIC_FINANCE_API_URL }}
        run: npm run build

      - name: Verify static export
        run: test -s out/index.html

      - name: Deploy isolated Finance preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "06248f5811845de4c1d9bb93f86f5a16"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          npx --yes wrangler@4 deploy --assets ./out --name kaamkitpro-finance-web-preview --compatibility-date 2026-11-06
