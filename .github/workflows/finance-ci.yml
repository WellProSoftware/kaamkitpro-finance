name: Finance CI Summary

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Run API tests
        working-directory: api
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - name: Validate API container
        run: docker build -t kaamkitpro-finance-api:ci api
