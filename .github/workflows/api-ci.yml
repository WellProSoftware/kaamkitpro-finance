name: Finance API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  test-and-container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run API tests
        working-directory: api
        run: python -m pytest -q
      - name: Validate Docker image build
        run: docker build -t kaamkitpro-finance-api:ci api
